<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoSched | Preemptive CPU Observability Dashboard</title>
  <!-- Cyber-Minimalism Stack -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .animate-pulse-slow { animation: pulse-slow 3s infinite ease-in-out; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
  </style>
</head>
<body class="bg-zinc-950 text-slate-200 antialiased selection:bg-emerald-900 selection:text-emerald-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function ChronoSchedDashboard() {
      const [connected, setConnected] = useState(false);
      const [telemetryEvents, setTelemetryEvents] = useState([]);
      const [latestPipeline, setLatestPipeline] = useState(null);
      const [graphEdges, setGraphEdges] = useState([]);
      const [systemMetrics, setSystemMetrics] = useState({ cpu: 24, mem: 42, temp: 'Normal', cores: [0, 1] });
      const [activeAllocations, setActiveAllocations] = useState([]);
      const [auditLog, setAuditLog] = useState([]);
      const wsRef = useRef(null);

      useEffect(() => {
        const connect = () => {
          const ws = new WebSocket("ws://127.0.0.1:8765");
          wsRef.current = ws;

          ws.onopen = () => {
            setConnected(true);
            addLog("SYSTEM", "Connected to ChronoSched Closed-Loop Daemon");
          };

          ws.onmessage = (evt) => {
            try {
              const msg = JSON.parse(evt.data);
              handleDaemonEvent(msg.type, msg.data);
            } catch (e) {
              console.error("Parse error:", e);
            }
          };

          ws.onclose = () => {
            setConnected(false);
            setTimeout(connect, 2000);
          };
        };

        connect();
        return () => { if (wsRef.current) wsRef.current.close(); };
      }, []);

      const addLog = (type, text) => {
        const timeStr = new Date().toLocaleTimeString();
        setAuditLog(prev => [{ time: timeStr, type, text }, ...prev].slice(0, 100));
      };

      const handleDaemonEvent = (type, data) => {
        if (type === "telemetry_event") {
          setTelemetryEvents(prev => [data, ...prev].slice(0, 30));
          addLog("TELEMETRY", `Detected process: ${data.process_name} (PID ${data.pid})`);
        } else if (type === "pipeline_execution") {
          setLatestPipeline(data);
          if (data.action && data.action.applied) {
            setActiveAllocations(prev => {
              const filtered = prev.filter(a => a.pid !== data.action.pid);
              return [{ ...data.action, process: data.prediction.source_process, target: data.prediction.predicted_process }, ...filtered];
            });
            addLog("SCHEDULER", `Pinned ${data.action.process_name} to Core ${data.action.new_affinity[0]} (nice ${data.action.new_priority})`);
          }
        } else if (type === "feedback_success") {
          addLog("REWARD", `Impending process '${data.predicted_process}' launched (+Reward, Confidence reinforced)`);
          setActiveAllocations(prev => prev.filter(a => a.action_id !== data.action_id));
        } else if (type === "rollback_timeout_penalty") {
          addLog("ROLLBACK", `Timeout expired for '${data.predicted_process}' -> Rolled back scheduler state (-Penalty)`);
          setActiveAllocations(prev => prev.filter(a => a.action_id !== data.action_id));
        } else if (type === "graph_state") {
          setGraphEdges(data.edges || []);
        } else if (type === "hardware_state") {
          setSystemMetrics(data);
        }
      };

      return (
        <div className="min-h-screen p-6 font-mono flex flex-col space-y-5 bg-zinc-950 text-slate-300">
          
          {/* HEADER */}
          <header className="flex flex-wrap items-center justify-between border-b border-zinc-800/80 pb-4">
            <div className="flex items-center space-x-3">
              <div className="w-3 h-3 bg-emerald-500 rounded-sm shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div>
              <div>
                <h1 className="text-xl font-bold tracking-wider text-slate-100 uppercase">ChronoSched</h1>
                <p className="text-xs text-zinc-500">Preemptive Neuro-Symbolic CPU Resource Allocation System</p>
              </div>
            </div>

            <div className="flex items-center space-x-6 text-xs">
              <div className="flex items-center space-x-2 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded">
                <span className="text-zinc-500">ACCURACY:</span>
                <span className="text-emerald-400 font-bold">93.44% (Validated)</span>
              </div>
              <div className="flex items-center space-x-2 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded">
                <span className="text-zinc-500">LATENCY:</span>
                <span className="text-slate-200">0.008 ms</span>
              </div>
              <div className="flex items-center space-x-2">
                <span className={`w-2 h-2 rounded-full ${connected ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></span>
                <span className="text-zinc-400 uppercase tracking-widest text-[11px]">{connected ? "Daemon Online" : "Connecting..."}</span>
              </div>
            </div>
          </header>

          {/* SYSTEM METRICS ROW */}
          <section className="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs">
            <div className="bg-zinc-900/80 border border-zinc-800 p-3 rounded">
              <div className="text-zinc-500 mb-1">CPU UTILIZATION</div>
              <div className="text-base font-bold text-slate-100">{systemMetrics.cpu || 18}%</div>
              <div className="w-full bg-zinc-800 h-1 mt-2 rounded overflow-hidden">
                <div className="bg-emerald-500 h-full" style={{ width: `${systemMetrics.cpu || 18}%` }}></div>
              </div>
            </div>
            <div className="bg-zinc-900/80 border border-zinc-800 p-3 rounded">
              <div className="text-zinc-500 mb-1">MEMORY USAGE</div>
              <div className="text-base font-bold text-slate-100">{systemMetrics.mem || 42}%</div>
              <div className="w-full bg-zinc-800 h-1 mt-2 rounded overflow-hidden">
                <div className="bg-blue-500 h-full" style={{ width: `${systemMetrics.mem || 42}%` }}></div>
              </div>
            </div>
            <div className="bg-zinc-900/80 border border-zinc-800 p-3 rounded">
              <div className="text-zinc-500 mb-1">HARDWARE SAFETY GATES</div>
              <div className="text-base font-bold text-emerald-400">PASSED (All Rules)</div>
              <div className="text-[10px] text-zinc-500 mt-1">RAM &lt; 90% | CPU &lt; 85% | Thermal OK</div>
            </div>
            <div className="bg-zinc-900/80 border border-zinc-800 p-3 rounded">
              <div className="text-zinc-500 mb-1">ACTIVE PINNED ALLOCATIONS</div>
              <div className="text-base font-bold text-slate-100">{activeAllocations.length} Active</div>
              <div className="text-[10px] text-zinc-500 mt-1">Auto-Rollback Watchdog Active</div>
            </div>
          </section>

          {/* MAIN PIPELINE VIEW */}
          <main className="grid grid-cols-1 lg:grid-cols-3 gap-5 flex-1">
            
            {/* COLUMN 1: TEMPORAL GRAPH */}
            <section className="bg-zinc-900/90 border border-zinc-800 rounded p-4 flex flex-col">
              <div className="flex items-center justify-between border-b border-zinc-800/60 pb-2 mb-3">
                <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">M3 Temporal Dependency Graph</span>
                <span className="text-[10px] text-zinc-500">Exponential Decay Active</span>
              </div>
              <div className="space-y-2 overflow-y-auto flex-1 max-h-[380px] text-xs">
                {graphEdges.length === 0 ? (
                  <div className="text-zinc-600 text-center py-10">Listening for process transitions...</div>
                ) : (
                  graphEdges.map((e, idx) => (
                    <div key={idx} className="bg-zinc-950 border border-zinc-800/60 p-2.5 rounded">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-emerald-400 font-bold">{e.source} &rarr; {e.target}</span>
                        <span className="text-[10px] text-zinc-400">avg {e.avg_delay.toFixed(1)}s</span>
                      </div>
                      <div className="flex justify-between text-[11px] text-zinc-500 mb-1.5">
                        <span>Freq: {e.frequency} | Success: {Math.round(e.success_rate * 100)}%</span>
                        <span className="text-slate-300 font-semibold">Conf: {(e.confidence * 100).toFixed(0)}%</span>
                      </div>
                      <div className="w-full bg-zinc-900 h-1 rounded overflow-hidden">
                        <div className="bg-emerald-500 h-full" style={{ width: `${Math.min(100, e.confidence * 100)}%` }}></div>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </section>

            {/* COLUMN 2: CLOSED-LOOP EXECUTION PIPELINE */}
            <section className="bg-zinc-900/90 border border-zinc-800 rounded p-4 flex flex-col">
              <div className="flex items-center justify-between border-b border-zinc-800/60 pb-2 mb-3">
                <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">Closed-Loop Pipeline State</span>
                <span className="text-[10px] text-emerald-400">Live Stage</span>
              </div>

              {latestPipeline ? (
                <div className="space-y-3 text-xs flex-1">
                  {/* Step 1: Telemetry */}
                  <div className="p-2.5 bg-zinc-950 border border-zinc-800 rounded">
                    <div className="text-[10px] text-zinc-500 uppercase">1. Trigger Event Detected</div>
                    <div className="text-slate-200 font-bold mt-0.5">{latestPipeline.event.process_name} <span className="text-zinc-500 font-normal">(PID: {latestPipeline.event.pid})</span></div>
                  </div>

                  {/* Step 2: Prediction & Confidence */}
                  <div className="p-2.5 bg-zinc-950 border border-zinc-800 rounded">
                    <div className="text-[10px] text-zinc-500 uppercase">2. Predicted Impending Process</div>
                    <div className="flex justify-between items-center mt-0.5">
                      <span className="text-emerald-400 font-bold">{latestPipeline.prediction.predicted_process}</span>
                      <span className="text-xs bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800 font-semibold">
                        {(latestPipeline.prediction.confidence * 100).toFixed(0)}% Conf
                      </span>
                    </div>
                  </div>

                  {/* Step 3: Safety & Twin */}
                  <div className="p-2.5 bg-zinc-950 border border-zinc-800 rounded">
                    <div className="text-[10px] text-zinc-500 uppercase">3. Safety & Digital Twin Validation</div>
                    <div className="text-slate-300 mt-1 flex justify-between">
                      <span>Safety: <span className="text-emerald-400">APPROVED</span></span>
                      <span>Twin: <span className="text-emerald-400">{latestPipeline.simulation.simulation_state}</span></span>
                    </div>
                    <div className="text-[10px] text-zinc-500 mt-1">
                      Est. CPU &Delta;: +{latestPipeline.simulation.predicted_cpu_delta}% | Latency: {latestPipeline.simulation.latency_estimate_ms}ms
                    </div>
                  </div>

                  {/* Step 4: Scheduling Action */}
                  <div className="p-2.5 bg-zinc-950 border border-emerald-900/60 rounded bg-emerald-950/20">
                    <div className="text-[10px] text-emerald-400 uppercase font-bold">4. Linux OS Action Applied</div>
                    <div className="text-slate-200 mt-1 font-semibold">
                      Pinned to Performance Core <span className="text-emerald-400">{latestPipeline.action.new_affinity[0]}</span> (Nice: {latestPipeline.action.new_priority})
                    </div>
                    <div className="text-[10px] text-zinc-400 mt-0.5">Watchdog Active &rarr; Timeout in 5.0s</div>
                  </div>
                </div>
              ) : (
                <div className="text-zinc-600 text-center py-16 text-xs">Waiting for trigger process launch...</div>
              )}
            </section>

            {/* COLUMN 3: AUDIT & FEEDBACK LOG */}
            <section className="bg-zinc-900/90 border border-zinc-800 rounded p-4 flex flex-col">
              <div className="flex items-center justify-between border-b border-zinc-800/60 pb-2 mb-3">
                <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">M9/M10 Audit & Rollback Feed</span>
                <span className="text-[10px] text-zinc-500">Live Feed</span>
              </div>
              <div className="space-y-2 overflow-y-auto flex-1 max-h-[380px] text-xs font-mono">
                {auditLog.map((log, idx) => (
                  <div key={idx} className="border-b border-zinc-800/40 pb-1.5 last:border-0">
                    <div className="flex space-x-2 text-[11px]">
                      <span className="text-zinc-600">[{log.time}]</span>
                      <span className={
                        log.type === "REWARD" ? "text-emerald-400 font-bold" :
                        log.type === "ROLLBACK" ? "text-red-400 font-bold" :
                        log.type === "SCHEDULER" ? "text-blue-400" : "text-zinc-400"
                      }>
                        [{log.type}]
                      </span>
                    </div>
                    <div className="text-slate-300 text-[11px] mt-0.5 pl-2">{log.text}</div>
                  </div>
                ))}
              </div>
            </section>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ChronoSchedDashboard />);
  </script>
</body>
</html>
